# This compose file is used for end-to-end testing the UI against the PlanDev services.
# It assumes the main PlanDev repository has been cloned into this repo as a sub-directory called 'plandev'.
# See .github/workflows/test.yml for how this file is utilized.

# Shared values for the test backend, referenced below via YAML aliases (*name).
# NOTE: YAML aliases can't be embedded inside strings, so the hasura database URLs repeat
# the plandev username/password/database values; keep them in sync if these change.
x-plandev-env:
  plandev_file_store_name: &plandev_file_store_name plandev_file_store
  plandev_db: &plandev_db plandev
  plandev_metadata_db: &plandev_metadata_db plandev_hasura
  plandev_username: &plandev_username plandev_admin
  plandev_password: &plandev_password plandev_password
  gateway_username: &gateway_username gatewayUsername
  gateway_password: &gateway_password gatewayPassword
  merlin_username: &merlin_username merlinUsername
  merlin_password: &merlin_password merlinPassword
  scheduler_username: &scheduler_username schedulerUsername
  scheduler_password: &scheduler_password schedulerPassword
  sequencing_username: &sequencing_username sequencingUsername
  sequencing_password: &sequencing_password sequencingPassword
  postgres_user: &postgres_user postgresUsername
  postgres_password: &postgres_password postgresPassword
  hasura_admin_secret: &hasura_admin_secret plandev
  hasura_jwt_secret: &hasura_jwt_secret '{ "type": "HS256", "key": "oursupersecretsupersecurekey1234567890" }'
  hasura_graphql_url: &hasura_graphql_url http://hasura:8080/v1/graphql
  plandev_db_host: &plandev_db_host postgres
  plandev_db_port: &plandev_db_port 5432
  merlin_local_store: &merlin_local_store /usr/src/app/merlin_file_store
  untrue_plan_start: &untrue_plan_start '2000-01-01T11:58:55.816Z'
  log_file: &log_file console
  log_level: &log_level debug
  java_opts: &java_opts >
    -Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
    -Dorg.slf4j.simpleLogger.log.com.zaxxer.hikari=INFO
    -Dorg.slf4j.simpleLogger.logFile=System.err
  java_opts_debug: &java_opts_debug >
    -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    -Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
    -Dorg.slf4j.simpleLogger.log.com.zaxxer.hikari=INFO
    -Dorg.slf4j.simpleLogger.logFile=System.err

services:
  plandev_action:
    container_name: plandev_action
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: *hasura_admin_secret
      HASURA_GRAPHQL_JWT_SECRET: *hasura_jwt_secret
      LOG_FILE: *log_file
      LOG_LEVEL: *log_level
      MERLIN_GRAPHQL_URL: *hasura_graphql_url
      PORT: 27186
      PLANDEV_DB: *plandev_db
      PLANDEV_DB_HOST: *plandev_db_host
      PLANDEV_DB_PORT: *plandev_db_port
      ACTION_COOKIE_NAMES: ''
      ACTION_CORS_ALLOWED_ORIGIN: ''
      ACTION_DB_USER: *sequencing_username
      ACTION_DB_PASSWORD: *sequencing_password
      ACTION_LOCAL_STORE: /usr/src/app/action_file_store
      ACTION_WORKER_NUM: 8
      ACTION_MAX_WORKER_NUM: 8
    image: 'ghcr.io/nasa-ammos/plandev-action:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27186:27186']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/action_file_store
  plandev_gateway:
    container_name: plandev_gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_TYPE: none
      GQL_API_URL: http://localhost:8080/v1/graphql
      HASURA_GRAPHQL_JWT_SECRET: *hasura_jwt_secret
      LOG_FILE: *log_file
      LOG_LEVEL: *log_level
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      PORT: 9000
      PLANDEV_DB: *plandev_db
      PLANDEV_DB_HOST: *plandev_db_host
      PLANDEV_DB_PORT: *plandev_db_port
      GATEWAY_DB_USER: *gateway_username
      GATEWAY_DB_PASSWORD: *gateway_password
    image: 'ghcr.io/nasa-ammos/plandev-gateway:${GATEWAY_IMAGE_TAG:-develop}'
    ports: ['9000:9000']
    restart: always
    volumes:
      - plandev_file_store:/app/files
  plandev_merlin:
    container_name: plandev_merlin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: *hasura_admin_secret
      HASURA_GRAPHQL_URL: *hasura_graphql_url
      PLANDEV_DB: *plandev_db
      PLANDEV_DB_HOST: *plandev_db_host
      PLANDEV_DB_PORT: *plandev_db_port
      MERLIN_DB_USER: *merlin_username
      MERLIN_DB_PASSWORD: *merlin_password
      MERLIN_LOCAL_STORE: *merlin_local_store
      MERLIN_PORT: 27183
      MERLIN_USE_NEW_CONSTRAINT_PIPELINE: 'true'
      JAVA_OPTS: *java_opts
      UNTRUE_PLAN_START: *untrue_plan_start
    image: 'ghcr.io/nasa-ammos/plandev-merlin:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27183:27183']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/merlin_file_store
  plandev_merlin_worker:
    container_name: plandev_merlin_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLANDEV_DB: *plandev_db
      PLANDEV_DB_HOST: *plandev_db_host
      PLANDEV_DB_PORT: *plandev_db_port
      MERLIN_DB_USER: *merlin_username
      MERLIN_DB_PASSWORD: *merlin_password
      MERLIN_WORKER_LOCAL_STORE: *merlin_local_store
      SIMULATION_PROGRESS_POLL_PERIOD_MILLIS: 2000
      JAVA_OPTS: *java_opts
      UNTRUE_PLAN_START: *untrue_plan_start
    image: 'ghcr.io/nasa-ammos/plandev-merlin-worker:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27187:8080']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/merlin_file_store:ro
  plandev_scheduler:
    container_name: plandev_scheduler
    depends_on:
      plandev_merlin:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: *hasura_admin_secret
      MERLIN_GRAPHQL_URL: *hasura_graphql_url
      PLANDEV_DB: *plandev_db
      PLANDEV_DB_HOST: *plandev_db_host
      PLANDEV_DB_PORT: *plandev_db_port
      SCHEDULER_DB_USER: *scheduler_username
      SCHEDULER_DB_PASSWORD: *scheduler_password
      SCHEDULER_PORT: 27185
      JAVA_OPTS: *java_opts
    image: 'ghcr.io/nasa-ammos/plandev-scheduler:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27185:27185']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/merlin_file_store
  plandev_scheduler_worker:
    container_name: plandev_scheduler_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: *hasura_admin_secret
      MERLIN_GRAPHQL_URL: *hasura_graphql_url
      MERLIN_LOCAL_STORE: *merlin_local_store
      SCHEDULER_OUTPUT_MODE: UpdateInputPlanWithNewActivities
      SCHEDULER_RULES_JAR: /usr/src/app/merlin_file_store/scheduler_rules.jar
      PLANDEV_DB: *plandev_db
      PLANDEV_DB_HOST: *plandev_db_host
      PLANDEV_DB_PORT: *plandev_db_port
      SCHEDULER_DB_USER: *scheduler_username
      SCHEDULER_DB_PASSWORD: *scheduler_password
      JAVA_OPTS: *java_opts_debug
    image: 'ghcr.io/nasa-ammos/plandev-scheduler-worker:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27189:8080']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/merlin_file_store:ro
  plandev_sequencing:
    container_name: plandev_sequencing
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: *hasura_admin_secret
      LOG_FILE: *log_file
      LOG_LEVEL: *log_level
      MERLIN_GRAPHQL_URL: *hasura_graphql_url
      PLANDEV_DB: *plandev_db
      PLANDEV_DB_HOST: *plandev_db_host
      PLANDEV_DB_PORT: *plandev_db_port
      SEQUENCING_DB_USER: *sequencing_username
      SEQUENCING_DB_PASSWORD: *sequencing_password
      SEQUENCING_LOCAL_STORE: /usr/src/app/sequencing_file_store
      SEQUENCING_SERVER_PORT: 27184
      SEQUENCING_LANGUAGE: 'SEQN'
    image: 'ghcr.io/nasa-ammos/plandev-sequencing:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27184:27184']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/sequencing_file_store
  hasura:
    container_name: plandev_hasura
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLANDEV_DATABASE_URL: 'postgres://plandev_admin:plandev_password@postgres:5432/plandev?options=-c%20search_path%3Dutil_functions%2Chasura%2Cpermissions%2Ctags%2Cmerlin%2Cscheduler%2Csequencing%2Cactions%2Cui%2Cpublic'
      PLANDEV_MERLIN_URL: 'http://plandev_merlin:27183'
      PLANDEV_SCHEDULER_URL: 'http://plandev_scheduler:27185'
      PLANDEV_SEQUENCING_URL: 'http://plandev_sequencing:27184'
      HASURA_GRAPHQL_ADMIN_SECRET: *hasura_admin_secret
      HASURA_GRAPHQL_DEV_MODE: 'true'
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_INFER_FUNCTION_PERMISSIONS: false
      HASURA_GRAPHQL_JWT_SECRET: *hasura_jwt_secret
      HASURA_GRAPHQL_LOG_LEVEL: info
      HASURA_GRAPHQL_METADATA_DATABASE_URL: 'postgres://plandev_admin:plandev_password@postgres:5432/plandev_hasura'
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
      # Default is 30s; give migrations more room when Postgres is slow to accept connections.
      HASURA_GRAPHQL_MIGRATIONS_SERVER_TIMEOUT: '60'
    image: 'ghcr.io/nasa-ammos/plandev-hasura:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['8080:8080']
    restart: always
  postgres:
    container_name: plandev_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: *postgres_password
      POSTGRES_USER: *postgres_user
      PLANDEV_DB: *plandev_db
      PLANDEV_METADATA_DB: *plandev_metadata_db
      PLANDEV_USERNAME: *plandev_username
      PLANDEV_PASSWORD: *plandev_password
      GATEWAY_DB_USER: *gateway_username
      GATEWAY_DB_PASSWORD: *gateway_password
      MERLIN_DB_USER: *merlin_username
      MERLIN_DB_PASSWORD: *merlin_password
      SCHEDULER_DB_USER: *scheduler_username
      SCHEDULER_DB_PASSWORD: *scheduler_password
      SEQUENCING_DB_USER: *sequencing_username
      SEQUENCING_DB_PASSWORD: *sequencing_password
    image: 'ghcr.io/nasa-ammos/plandev-postgres:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['5432:5432']
    restart: always
    # Gate dependents on Postgres actually accepting connections. Without this, every service
    # (hasura, merlin, gateway, ...) starts immediately and races Postgres, logging "connection
    # refused" retries and, for Hasura, risking a migration timeout on a slow runner. start_period
    # covers the plandev-postgres image's first-run DB/schema initialization.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - postgres_data:/var/lib/postgresql/data
  plandev_workspace:
    container_name: plandev_workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLANDEV_DB: *plandev_db
      PLANDEV_DB_HOST: *plandev_db_host
      PLANDEV_DB_PORT: *plandev_db_port
      HASURA_GRAPHQL_ADMIN_SECRET: *hasura_admin_secret
      HASURA_GRAPHQL_JWT_SECRET: *hasura_jwt_secret
      MERLIN_GRAPHQL_URL: *hasura_graphql_url
      SEQUENCING_DB_USER: *sequencing_username
      SEQUENCING_DB_PASSWORD: *sequencing_password
      WORKSPACE_STORE: /usr/src/ws
      WORKSPACE_PORT: 28000
      JAVA_OPTS: *java_opts_debug
    image: 'ghcr.io/nasa-ammos/plandev-workspace:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['28000:28000', '5015:5005']
    restart: always
    volumes:
      - workspace_file_store:/usr/src/ws
volumes:
  plandev_file_store:
    name: *plandev_file_store_name
  postgres_data:
  workspace_file_store:
