# This compose file is used for end-to-end testing the UI against the PlanDev services.
# It assumes the main PlanDev repository has been cloned into this repo as a sub-directory called 'plandev'.
# See .github/workflows/test.yml for how this file is utilized.

version: '3.7'
services:
  plandev_action:
    container_name: plandev_action
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_GRAPHQL_ADMIN_SECRET}'
      HASURA_GRAPHQL_JWT_SECRET: '${HASURA_GRAPHQL_JWT_SECRET}'
      LOG_FILE: console
      LOG_LEVEL: debug
      MERLIN_GRAPHQL_URL: http://hasura:8080/v1/graphql
      PORT: 27186
      AERIE_DB_HOST: postgres
      AERIE_DB_PORT: 5432
      ACTION_COOKIE_NAMES: '${ACTION_COOKIE_NAMES}'
      ACTION_CORS_ALLOWED_ORIGIN: '${ACTION_CORS_ALLOWED_ORIGIN}'
      ACTION_DB_USER: '${SEQUENCING_USERNAME}'
      ACTION_DB_PASSWORD: '${SEQUENCING_PASSWORD}'
      ACTION_LOCAL_STORE: /usr/src/app/action_file_store
      ACTION_WORKER_NUM: 8
      ACTION_MAX_WORKER_NUM: 8
    image: 'ghcr.io/nasa-ammos/plandev-action:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27186:27186']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/action_file_store
  plandev_gateway:
    container_name: plandev_gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_TYPE: none
      GQL_API_URL: http://localhost:8080/v1/graphql
      HASURA_GRAPHQL_JWT_SECRET: '${HASURA_GRAPHQL_JWT_SECRET}'
      LOG_FILE: console
      LOG_LEVEL: debug
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      PORT: 9000
      AERIE_DB_HOST: postgres
      AERIE_DB_PORT: 5432
      GATEWAY_DB_USER: '${GATEWAY_USERNAME}'
      GATEWAY_DB_PASSWORD: '${GATEWAY_PASSWORD}'
    image: 'ghcr.io/nasa-ammos/plandev-gateway:${GATEWAY_IMAGE_TAG:-develop}'
    ports: ['9000:9000']
    restart: always
    volumes:
      - plandev_file_store:/app/files
  plandev_merlin:
    container_name: plandev_merlin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_GRAPHQL_ADMIN_SECRET}'
      HASURA_GRAPHQL_URL: http://hasura:8080/v1/graphql
      AERIE_DB_HOST: postgres
      AERIE_DB_PORT: 5432
      MERLIN_DB_USER: '${MERLIN_USERNAME}'
      MERLIN_DB_PASSWORD: '${MERLIN_PASSWORD}'
      MERLIN_LOCAL_STORE: /usr/src/app/merlin_file_store
      MERLIN_PORT: 27183
      MERLIN_USE_NEW_CONSTRAINT_PIPELINE: 'true'
      JAVA_OPTS: >
        -Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
        -Dorg.slf4j.simpleLogger.log.com.zaxxer.hikari=INFO
        -Dorg.slf4j.simpleLogger.logFile=System.err
      UNTRUE_PLAN_START: '2000-01-01T11:58:55.816Z'
    image: 'ghcr.io/nasa-ammos/plandev-merlin:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27183:27183']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/merlin_file_store
  plandev_merlin_worker:
    container_name: plandev_merlin_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AERIE_DB_HOST: postgres
      AERIE_DB_PORT: 5432
      MERLIN_DB_USER: '${MERLIN_USERNAME}'
      MERLIN_DB_PASSWORD: '${MERLIN_PASSWORD}'
      MERLIN_WORKER_LOCAL_STORE: /usr/src/app/merlin_file_store
      SIMULATION_PROGRESS_POLL_PERIOD_MILLIS: 2000
      JAVA_OPTS: >
        -Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
        -Dorg.slf4j.simpleLogger.log.com.zaxxer.hikari=INFO
        -Dorg.slf4j.simpleLogger.logFile=System.err
      UNTRUE_PLAN_START: '2000-01-01T11:58:55.816Z'
    image: 'ghcr.io/nasa-ammos/plandev-merlin-worker:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27187:8080']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/merlin_file_store:ro
  plandev_scheduler:
    container_name: plandev_scheduler
    depends_on:
      plandev_merlin:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_GRAPHQL_ADMIN_SECRET}'
      MERLIN_GRAPHQL_URL: http://hasura:8080/v1/graphql
      AERIE_DB_HOST: postgres
      AERIE_DB_PORT: 5432
      SCHEDULER_DB_USER: '${SCHEDULER_USERNAME}'
      SCHEDULER_DB_PASSWORD: '${SCHEDULER_PASSWORD}'
      SCHEDULER_PORT: 27185
      JAVA_OPTS: >
        -Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
        -Dorg.slf4j.simpleLogger.log.com.zaxxer.hikari=INFO
        -Dorg.slf4j.simpleLogger.logFile=System.err
    image: 'ghcr.io/nasa-ammos/plandev-scheduler:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27185:27185']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/merlin_file_store
  plandev_scheduler_worker:
    container_name: plandev_scheduler_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_GRAPHQL_ADMIN_SECRET}'
      MERLIN_GRAPHQL_URL: http://hasura:8080/v1/graphql
      MERLIN_LOCAL_STORE: /usr/src/app/merlin_file_store
      SCHEDULER_OUTPUT_MODE: UpdateInputPlanWithNewActivities
      SCHEDULER_RULES_JAR: /usr/src/app/merlin_file_store/scheduler_rules.jar
      AERIE_DB_HOST: postgres
      AERIE_DB_PORT: 5432
      SCHEDULER_DB_USER: '${SCHEDULER_USERNAME}'
      SCHEDULER_DB_PASSWORD: '${SCHEDULER_PASSWORD}'
      JAVA_OPTS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
        -Dorg.slf4j.simpleLogger.log.com.zaxxer.hikari=INFO
        -Dorg.slf4j.simpleLogger.logFile=System.err
    image: 'ghcr.io/nasa-ammos/plandev-scheduler-worker:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27189:8080']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/merlin_file_store:ro
  plandev_sequencing:
    container_name: plandev_sequencing
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_GRAPHQL_ADMIN_SECRET}'
      LOG_FILE: console
      LOG_LEVEL: debug
      MERLIN_GRAPHQL_URL: http://hasura:8080/v1/graphql
      AERIE_DB_HOST: postgres
      AERIE_DB_PORT: 5432
      SEQUENCING_DB_USER: '${SEQUENCING_USERNAME}'
      SEQUENCING_DB_PASSWORD: '${SEQUENCING_PASSWORD}'
      SEQUENCING_LOCAL_STORE: /usr/src/app/sequencing_file_store
      SEQUENCING_SERVER_PORT: 27184
      SEQUENCING_LANGUAGE: 'SEQN'
    image: 'ghcr.io/nasa-ammos/plandev-sequencing:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['27184:27184']
    restart: always
    volumes:
      - plandev_file_store:/usr/src/app/sequencing_file_store
  hasura:
    container_name: plandev_hasura
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AERIE_DATABASE_URL: 'postgres://${AERIE_USERNAME}:${AERIE_PASSWORD}@postgres:5432/aerie?options=-c%20search_path%3Dutil_functions%2Chasura%2Cpermissions%2Ctags%2Cmerlin%2Cscheduler%2Csequencing%2Cpublic'
      AERIE_MERLIN_URL: 'http://plandev_merlin:27183'
      AERIE_SCHEDULER_URL: 'http://plandev_scheduler:27185'
      AERIE_SEQUENCING_URL: 'http://plandev_sequencing:27184'
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_GRAPHQL_ADMIN_SECRET}'
      HASURA_GRAPHQL_DEV_MODE: 'true'
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_INFER_FUNCTION_PERMISSIONS: false
      HASURA_GRAPHQL_JWT_SECRET: '${HASURA_GRAPHQL_JWT_SECRET}'
      HASURA_GRAPHQL_LOG_LEVEL: info
      HASURA_GRAPHQL_METADATA_DATABASE_URL: 'postgres://${AERIE_USERNAME}:${AERIE_PASSWORD}@postgres:5432/aerie_hasura'
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
      # Default is 30s; give migrations more room when Postgres is slow to accept connections.
      HASURA_GRAPHQL_MIGRATIONS_SERVER_TIMEOUT: '60'
    image: 'ghcr.io/nasa-ammos/plandev-hasura:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['8080:8080']
    restart: always
  postgres:
    container_name: plandev_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_USER: '${POSTGRES_USER}'
      AERIE_USERNAME: '${AERIE_USERNAME}'
      AERIE_PASSWORD: '${AERIE_PASSWORD}'
      GATEWAY_DB_USER: '${GATEWAY_USERNAME}'
      GATEWAY_DB_PASSWORD: '${GATEWAY_PASSWORD}'
      MERLIN_DB_USER: '${MERLIN_USERNAME}'
      MERLIN_DB_PASSWORD: '${MERLIN_PASSWORD}'
      SCHEDULER_DB_USER: '${SCHEDULER_USERNAME}'
      SCHEDULER_DB_PASSWORD: '${SCHEDULER_PASSWORD}'
      SEQUENCING_DB_USER: '${SEQUENCING_USERNAME}'
      SEQUENCING_DB_PASSWORD: '${SEQUENCING_PASSWORD}'
    image: 'ghcr.io/nasa-ammos/plandev-postgres:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['5432:5432']
    restart: always
    # Gate dependents on Postgres actually accepting connections. Without this, every service
    # (hasura, merlin, gateway, ...) starts immediately and races Postgres, logging "connection
    # refused" retries and, for Hasura, risking a migration timeout on a slow runner. start_period
    # covers the plandev-postgres image's first-run DB/schema initialization.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - postgres_data:/var/lib/postgresql/data
  plandev_workspace:
    container_name: plandev_workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AERIE_DB_HOST: postgres
      AERIE_DB_PORT: 5432
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_GRAPHQL_ADMIN_SECRET}'
      HASURA_GRAPHQL_JWT_SECRET: '${HASURA_GRAPHQL_JWT_SECRET}'
      MERLIN_GRAPHQL_URL: http://hasura:8080/v1/graphql
      SEQUENCING_DB_USER: '${SEQUENCING_USERNAME}'
      SEQUENCING_DB_PASSWORD: '${SEQUENCING_PASSWORD}'
      WORKSPACE_STORE: /usr/src/ws
      WORKSPACE_PORT: 28000
      JAVA_OPTS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
        -Dorg.slf4j.simpleLogger.log.com.zaxxer.hikari=INFO
        -Dorg.slf4j.simpleLogger.logFile=System.err
    image: 'ghcr.io/nasa-ammos/plandev-workspace:${PLANDEV_IMAGE_TAG:-develop}'
    ports: ['28000:28000', '5015:5005']
    restart: always
    volumes:
      - workspace_file_store:/usr/src/ws
volumes:
  plandev_file_store:
  postgres_data:
  workspace_file_store:
