name: Publish

on:
  push:
    branches:
      - develop
      - dev-[0-9]+.[0-9]+.[0-9]+
    tags:
      - v*
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # (v6.0.3)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # (v6.4.0)
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install All Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Production Dependencies
        run: npm ci --production
      - name: Login to the Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # (v3.7.0)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # (v3.12.0)
      - name: Extract Metadata (tags and labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # (v5.10.0)
        with:
          images: ${{ env.REGISTRY }}/nasa-ammos/aerie-ui
      - name: Build Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # (v5.4.0)
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/nasa-ammos/aerie-ui:${{ github.sha }}
      - name: Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # (v5.4.0)
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan aerie-ui Docker image
        # pinned to commit for v0.35.0 https://github.com/aquasecurity/trivy-action/releases/tag/v0.35.0
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.REGISTRY }}/nasa-ammos/aerie-ui:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          trivyignores: .github/config/.trivyignore
