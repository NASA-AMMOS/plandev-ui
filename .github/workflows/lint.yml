name: Lint

on:
  pull_request:
    branches:
      - develop
      - dev-[0-9]+.[0-9]+.[0-9]+
  push:
    branches:
      - develop
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        # use `npm ci` for reproducible installs, fails if package & lock files are out of sync
        # install without running lifecycle scripts, then run only scripts approved in package.json's `allowScripts`
        run: |
          npm ci --ignore-scripts
          npm rebuild --strict-allow-scripts

      - name: Svelte Sync
        run: npm run sync

      - name: Count Lines of Code
        run: npm run cloc

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:css

      - name: Svelte Check
        run: npm run check
